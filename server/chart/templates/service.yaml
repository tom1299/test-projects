apiVersion: v1
kind: Service
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "server.selectorLabels" . | nindent 4 }}
  ports:
    - name: udp
      port: {{ .Values.service.udpPort }}
      targetPort: udp
      protocol: UDP
    - name: tcp
      port: {{ .Values.service.tcpPort }}
      targetPort: tcp
      protocol: TCP
